<div
  x-data="toastContainer()"x-cloak
  class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"
  aria-live="polite"
>
  <template x-for="toast in toasts" :key="toast.id">
    <div
      x-show="true"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="translate-x-10 opacity-0"
      x-transition:enter-end="translate-x-0 opacity-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0 translate-x-10"
      class="pointer-events-auto flex items-start gap-3 max-w-sm w-full bg-white border border-neutral-200 rounded-xl shadow-lg px-4 py-3"
    >
      <!-- Icon -->
      <span
        :class="{
          'bg-success-100 text-success-700': toast.type === 'success',
          'bg-danger-100 text-danger-700':   toast.type === 'error',
          'bg-warning-100 text-warning-700': toast.type === 'warning',
          'bg-blue-100 text-blue-700':       toast.type === 'info',
        }"
        class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 text-xs font-bold"
        x-text="iconFor(toast.type)"
      ></span>

      <!-- Message -->
      <p class="text-sm text-neutral-800 flex-1" x-text="toast.message"></p>

      <!-- Close -->
      <button
        @click="dismiss(toast.id)"
        class="text-neutral-400 hover:text-neutral-700 transition-colors shrink-0 mt-0.5"
        aria-label="Dismiss"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </template>
</div>
