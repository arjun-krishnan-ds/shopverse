{% if messages %}
<div class="space-y-2 mb-6" aria-live="polite">
  {% for message in messages %}
  <div class="flex items-start gap-3 px-4 py-3 rounded-xl text-sm font-medium border
    {% if message.tags == 'error' %}bg-danger-50 text-danger-700 border-danger-200
    {% elif message.tags == 'success' %}bg-success-50 text-success-700 border-success-200
    {% elif message.tags == 'warning' %}bg-warning-50 text-warning-700 border-warning-200
    {% else %}bg-blue-50 text-blue-700 border-blue-200{% endif %}" x-data="{ show: true }" x-show="show" x-cloak>
    <span class="flex-1">{{ message }}</span>
    <button @click="show = false" class="shrink-0 opacity-50 hover:opacity-100 transition-opacity" aria-label="Dismiss">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
