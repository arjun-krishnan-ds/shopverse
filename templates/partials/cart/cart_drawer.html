<div x-data="cartDrawer()"x-cloak class="relative z-40" aria-modal="true">

  <!-- Backdrop -->
  <div
    x-show="isOpen"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="close()"
    class="fixed inset-0 bg-black/40 backdrop-blur-sm"
  ></div>

  <!-- Panel -->
  <div
    x-show="isOpen"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    class="fixed right-0 top-0 h-full w-full max-w-sm bg-white shadow-2xl flex flex-col"
    @keydown.escape.window="close()"
  >

    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-neutral-200">
      <h2 class="text-base font-semibold text-neutral-900">
        Cart
        <span x-show="count > 0"
              class="ml-2 text-xs font-bold bg-brand-600 text-white px-2 py-0.5 rounded-full"
              x-text="count"></span>
      </h2>
      <button @click="close()" class="p-1.5 rounded-lg text-neutral-400 hover:text-neutral-700 hover:bg-neutral-100 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Empty state -->
    <div x-show="isEmpty && !loading" class="flex-1 flex flex-col items-center justify-center gap-4 px-5">
      <svg class="w-16 h-16 text-neutral-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <p class="text-sm text-neutral-500 font-medium">Your cart is empty</p>
      <a href="/products/"
         @click="close()"
         class="text-sm font-semibold text-brand-600 hover:text-brand-700 transition-colors">
        Browse products →
      </a>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="flex-1 flex items-center justify-center">
      <div class="w-8 h-8 border-2 border-brand-600 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Items -->
    <div x-show="!isEmpty && !loading" class="flex-1 overflow-y-auto px-5 py-4 space-y-4">
      <template x-for="item in items" :key="item.id">
        <div class="flex gap-4">
          <!-- Image -->
          <div class="w-16 h-16 rounded-xl bg-neutral-100 overflow-hidden shrink-0">
            <template x-if="item.image">
              <img :src="item.image" :alt="item.name" class="w-full h-full object-cover">
            </template>
          </div>

          <!-- Info -->
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-neutral-900 truncate" x-text="item.name"></p>
            <p class="text-xs text-neutral-500 mt-0.5" x-text="item.variant"></p>

            <div class="flex items-center justify-between mt-2">
              <!-- Qty -->
              <div class="flex items-center gap-1">
                <button
                  @click="updateQty(item.id, item.qty - 1)"
                  class="w-6 h-6 rounded border border-neutral-300 flex items-center justify-center text-neutral-600 hover:bg-neutral-100 text-sm transition-colors"
                >−</button>
                <span class="text-sm font-medium w-6 text-center" x-text="item.qty"></span>
                <button
                  @click="updateQty(item.id, item.qty + 1)"
                  class="w-6 h-6 rounded border border-neutral-300 flex items-center justify-center text-neutral-600 hover:bg-neutral-100 text-sm transition-colors"
                >+</button>
              </div>

              <!-- Price -->
              <p class="text-sm font-semibold text-neutral-900"
                 x-text="formatPrice(item.price * item.qty)"></p>
            </div>
          </div>

          <!-- Remove -->
          <button
            @click="removeItem(item.id)"
            class="self-start mt-1 text-neutral-300 hover:text-danger-500 transition-colors"
            aria-label="Remove"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </template>
    </div>

    <!-- Footer -->
    <div x-show="!isEmpty" class="border-t border-neutral-200 px-5 py-5 space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-sm text-neutral-600">Subtotal</span>
        <span class="text-base font-bold text-neutral-900" x-text="formatPrice(subtotal)"></span>
      </div>
      <a
        href="/orders/checkout/"
        class="block w-full text-center bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold py-3 rounded-xl transition-colors"
      >
        Checkout
      </a>
      <a
        href="/cart/"
        @click="close()"
        class="block w-full text-center text-sm text-neutral-600 hover:text-neutral-900 transition-colors"
      >
        View full cart
      </a>
    </div>

  </div>
</div>
