<div
  x-data="searchOverlay()"x-cloak
  x-show="isOpen"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm"
  @keydown.escape.window="close()"
  @click.self="close()"
>
  <div class="max-w-2xl mx-auto mt-20 px-4">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Input -->
      <div class="flex items-center gap-3 px-5 py-4 border-b border-neutral-200">
        <svg class="w-5 h-5 text-neutral-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          x-ref="searchInput"
          x-model="query"
          @input="onInput()"
          @keydown.enter.prevent="submit()"
          type="text"
          placeholder="Search products, brands..."
          class="flex-1 text-base outline-none bg-transparent placeholder-neutral-400"
        >
        <button @click="close()" class="text-neutral-400 hover:text-neutral-700 transition-colors text-sm">
          ESC
        </button>
      </div>

      <!-- Results -->
      <div x-show="results.length > 0" class="divide-y divide-neutral-100 max-h-96 overflow-y-auto">
        <template x-for="product in results" :key="product.id">
          <a
            :href="`/products/${product.slug}/`"
            class="flex items-center gap-4 px-5 py-3 hover:bg-neutral-50 transition-colors"
          >
            <div class="w-12 h-12 rounded-lg bg-neutral-100 overflow-hidden shrink-0">
              <template x-if="product.image">
                <img :src="product.image" :alt="product.name" class="w-full h-full object-cover">
              </template>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-neutral-900 truncate" x-text="product.name"></p>
              <p class="text-xs text-neutral-500" x-text="product.brand"></p>
            </div>
            <p class="text-sm font-semibold text-brand-600 shrink-0"
               x-text="product.price ? `₹${product.price.toLocaleString('en-IN')}` : ''">
            </p>
          </a>
        </template>
      </div>

      <!-- Loading -->
      <div x-show="loading" class="px-5 py-8 text-center text-sm text-neutral-500">
        Searching…
      </div>

      <!-- Empty -->
      <div
        x-show="!loading && query.length >= 2 && results.length === 0"
        class="px-5 py-8 text-center text-sm text-neutral-500"
      >
        No products found for "<span x-text="query"></span>"
      </div>

      <!-- Hint -->
      <div x-show="query.length === 0" class="px-5 py-4 text-xs text-neutral-400">
        Start typing to search products…
      </div>

    </div>
  </div>
</div>
