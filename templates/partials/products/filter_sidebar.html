<div class="lg:sticky lg:top-24">

    <div class="
        bg-white
        rounded-3xl
        border border-neutral-200
        shadow-sm
        overflow-hidden
    ">

        <!-- Header -->

        <div class="px-6 py-5 border-b border-neutral-100">

            <div class="flex items-center justify-between">

                <div>
                    <h2 class="font-bold text-lg text-neutral-900">
                        Filters
                    </h2>

                    <p class="text-xs text-neutral-500 mt-1">
                        Refine your shopping experience
                    </p>
                </div>

                <span
                    x-show="activeFilterCount"
                    x-text="activeFilterCount"
                    class="
                    w-8 h-8
                    rounded-full
                    bg-neutral-900
                    text-white
                    text-xs
                    font-bold
                    flex
                    items-center
                    justify-center
                ">
                </span>

            </div>

        </div>

        <!-- Active Filters -->

        <div
            x-show="activeFilterCount > 0"
            class="p-6 border-b border-neutral-100"
        >

            <div class="flex items-center justify-between mb-4">

                <h3 class="font-semibold text-sm text-neutral-900">
                    Active Filters
                </h3>

                <button
                    @click="reset()"
                    class="text-xs font-medium text-red-600"
                >
                    Clear All
                </button>

            </div>

            <div class="flex flex-wrap gap-2">

                <template x-if="filters.category">
                    <button
                        @click="clearFilter('category')"
                        class="px-3 py-1.5 rounded-full bg-neutral-900 text-white text-xs"
                    >
                        Category ✕
                    </button>
                </template>

                <template x-if="filters.brand">
                    <button
                        @click="clearFilter('brand')"
                        class="px-3 py-1.5 rounded-full bg-neutral-900 text-white text-xs"
                    >
                        Brand ✕
                    </button>
                </template>

                <template x-if="filters.rating">
                    <button
                        @click="clearFilter('rating')"
                        class="px-3 py-1.5 rounded-full bg-neutral-900 text-white text-xs"
                    >
                        <span x-text="filters.rating"></span>★+ ✕
                    </button>
                </template>

                <template x-if="filters.in_stock">
                    <button
                        @click="clearFilter('in_stock')"
                        class="px-3 py-1.5 rounded-full bg-neutral-900 text-white text-xs"
                    >
                        In Stock ✕
                    </button>
                </template>

            </div>

        </div>

        <!-- Content -->

        <div class="p-6 space-y-8">

            <!-- Sort -->

            <div>

                <button
                    @click="toggleSection('sort')"
                    class="flex items-center justify-between w-full"
                >
                    <span class="font-semibold text-neutral-900">
                        Sort By
                    </span>

                    <span x-text="sections.sort ? '−' : '+'"></span>
                </button>

                <div x-show="sections.sort" class="mt-4 space-y-2">

                    {% for value,label in sort_choices %}
                    <button
                        @click="filters.sort='{{ value }}'; apply()"
                        :class="isActive('sort','{{ value }}')
                            ? 'bg-neutral-900 text-white border-neutral-900'
                            : 'bg-white text-neutral-700 border-neutral-200 hover:border-neutral-400'"
                        class="w-full text-left px-4 py-3 rounded-2xl border transition-all"
                    >
                        {{ label }}
                    </button>
                    {% endfor %}

                </div>

            </div>

            <!-- Category -->

            {% if categories %}
            <div>

                <button
                    @click="toggleSection('category')"
                    class="flex items-center justify-between w-full"
                >
                    <span class="font-semibold text-neutral-900">
                        Categories
                    </span>

                    <span x-text="sections.category ? '−' : '+'"></span>
                </button>

                <div x-show="sections.category" class="mt-4 space-y-2">

                    {% for cat in categories %}
                    <button
                        @click="filters.category='{{ cat.slug }}'; apply()"
                        :class="isActive('category','{{ cat.slug }}')
                            ? 'bg-brand-50 border-brand-500 text-brand-700'
                            : 'bg-white border-neutral-200 text-neutral-700 hover:border-neutral-400'"
                        class="w-full flex items-center justify-between px-4 py-3 rounded-2xl border transition-all"
                    >
                        <span>{{ cat.name }}</span>

                        <span
                            x-show="isActive('category','{{ cat.slug }}')"
                        >
                            ✓
                        </span>
                    </button>
                    {% endfor %}

                </div>

            </div>
            {% endif %}

            <!-- Brand -->

            {% if brands %}
            <div>

                <button
                    @click="toggleSection('brand')"
                    class="flex items-center justify-between w-full"
                >
                    <span class="font-semibold text-neutral-900">
                        Brands
                    </span>

                    <span x-text="sections.brand ? '−' : '+'"></span>
                </button>

                <div x-show="sections.brand" class="mt-4 space-y-2">

                    {% for brand in brands %}
                    <button
                        @click="filters.brand='{{ brand.slug }}'; apply()"
                        :class="isActive('brand','{{ brand.slug }}')
                            ? 'bg-brand-50 border-brand-500 text-brand-700'
                            : 'bg-white border-neutral-200 text-neutral-700 hover:border-neutral-400'"
                        class="w-full flex items-center justify-between px-4 py-3 rounded-2xl border transition-all"
                    >
                        <span>{{ brand.name }}</span>

                        <span
                            x-show="isActive('brand','{{ brand.slug }}')"
                        >
                            ✓
                        </span>
                    </button>
                    {% endfor %}

                </div>

            </div>
            {% endif %}

            <!-- Price -->

            <div>

                <h3 class="font-semibold text-neutral-900 mb-4">
                    Price Range
                </h3>

                <div class="space-y-2">

                    <button
                        @click="setPrice('',5000)"
                        class="w-full px-4 py-3 text-left rounded-2xl border border-neutral-200 hover:border-neutral-400"
                    >
                        Under ₹5,000
                    </button>

                    <button
                        @click="setPrice(5000,10000)"
                        class="w-full px-4 py-3 text-left rounded-2xl border border-neutral-200 hover:border-neutral-400"
                    >
                        ₹5,000 – ₹10,000
                    </button>

                    <button
                        @click="setPrice(10000,20000)"
                        class="w-full px-4 py-3 text-left rounded-2xl border border-neutral-200 hover:border-neutral-400"
                    >
                        ₹10,000 – ₹20,000
                    </button>

                    <button
                        @click="setPrice(20000,'')"
                        class="w-full px-4 py-3 text-left rounded-2xl border border-neutral-200 hover:border-neutral-400"
                    >
                        ₹20,000+
                    </button>

                </div>

            </div>

            <!-- Rating -->

            <div>

                <h3 class="font-semibold text-neutral-900 mb-4">
                    Customer Rating
                </h3>

                <div class="space-y-2">

                    <button
                        @click="filters.rating='4'; apply()"
                        :class="isActive('rating','4')
                            ? 'bg-brand-50 border-brand-500 text-brand-700'
                            : 'border-neutral-200'"
                        class="w-full px-4 py-3 rounded-2xl border text-left"
                    >
                        ★★★★☆ & Up
                    </button>

                    <button
                        @click="filters.rating='3'; apply()"
                        :class="isActive('rating','3')
                            ? 'bg-brand-50 border-brand-500 text-brand-700'
                            : 'border-neutral-200'"
                        class="w-full px-4 py-3 rounded-2xl border text-left"
                    >
                        ★★★☆☆ & Up
                    </button>

                </div>

            </div>

            <!-- Stock -->

            <div>

                <label
                    class="flex items-center justify-between cursor-pointer"
                >

                    <span class="font-medium text-neutral-800">
                        In Stock Only
                    </span>

                    <input
                        type="checkbox"
                        x-model="filters.in_stock"
                        @change="apply()"
                        class="w-5 h-5 accent-brand-600"
                    >

                </label>

            </div>

        </div>

    </div>

</div>
